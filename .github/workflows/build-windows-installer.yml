name: Build Windows installer

on:
  push:
    branches:
      - sprint-03
  pull_request:
    branches:
      - sprint-03
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Install Python build dependencies
        run: python -m pip install -r installer/requirements-build.txt

      - name: Build and test installer
        run: python installer/build_windows.py --test-installer

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: BookstoreSetup-windows
          path: installer-output/BookstoreSetup.exe
          if-no-files-found: error
          retention-days: 30
